[package]
name = "ramus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
url = "2"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
sha2 = "0.10"
directories = "5"
rand = "0.8"
fuzzy-matcher = "0.3"
strsim = "0.11"
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
# Plex Companion players answer in XML (timelines, `/resources`).
quick-xml = "0.41"
# Parses the server's `Date` header (`PlexClient::server_time`).
httpdate = "1"
# The Mozilla root certificates as whole X.509 certificates, written out
# as the CA file libmpv verifies HTTPS streams against
# (`playback/ca_bundle.rs`). Same project and release train as the
# `webpki-roots` list reqwest trusts; keep the two on one version.
webpki-root-certs = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Used by token_store::hardware_uuid() to read MachineGuid from
# HKLM\SOFTWARE\Microsoft\Cryptography.
winreg = "0.55"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
wiremock = "0.6"
tempfile = "3"
# Compared against `webpki-root-certs` so the CA file handed to libmpv
# never drifts from the roots reqwest trusts (`playback/ca_bundle.rs`).
webpki-roots = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
