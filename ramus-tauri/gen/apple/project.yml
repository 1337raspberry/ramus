name: ramus-tauri
options:
  bundleIdPrefix: com.ramus.app
  deploymentTarget:
    # MPVKit's pre-built xcframeworks (Libuavs3d etc.) are compiled
    # with a 17.5 deployment target. Setting ours lower produces
    # "built for newer iOS version" linker warnings on every object
    # file. 17.5 silences them and is a safe floor for 2026.
    iOS: 17.5
fileGroups: [../../src]
configs:
  debug: debug
  release: release
# MPVKit ships libmpv + FFmpeg + libass as pre-built xcframeworks via
# SPM. The symbols are referenced from the `MpvController.swift` that
# lives inside `tauri-plugin-ramus-ios-bridge` (which ends up inside
# `libapp.a`), but Tauri doesn't forward transitive plugin SPM deps to
# the app's Xcode project — so without this declaration, the final
# app-link step fails with unresolved `_mpv_*` symbols. The plugin's
# own `ios/Package.swift` keeps its identical dependency so the Swift
# sources compile standalone too; SPM dedupes the actual resolution.
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 0.41.0
settingGroups:
  app:
    base:
      PRODUCT_NAME: ramus
      # Committed/release iOS identity, matching tauri.conf.json. This App ID may
      # not be registrable under a personal dev team, so local dev builds
      # override it to a signable identifier via scripts/ios-dev.sh
      # (`--config '{"identifier":"…"}'`) — see that script. Release/CI builds
      # keep com.ramus.app.
      PRODUCT_BUNDLE_IDENTIFIER: com.ramus.app
      # Signing team. xcodegen substitutes ${DEVELOPMENT_TEAM} from the
      # environment at generate-time; regen-ios-project.sh sources the
      # gitignored signing.local.env so a regen no longer blanks the team.
      # Empty (unset) leaves signing to be selected in Xcode / CI's own config.
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ramus-tauri_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        buildPhase: none
      - path: ramus-tauri_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: ramus-tauri_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # Substituted by xcodegen at generate-time from the RAMUS_VERSION
        # env var, which scripts/regen-ios-project.sh reads out of the
        # workspace Cargo.toml so iOS tracks the single-source-of-truth
        # version. Re-run the script after bumping the workspace version.
        CFBundleShortVersionString: ${RAMUS_VERSION}
        CFBundleVersion: ${RAMUS_VERSION}
        # audio: keeps the mpv decoder alive while the device is locked
        # or the app is backgrounded, which is how iOS knows to hand
        # control over to MPNowPlayingInfoCenter / MPRemoteCommandCenter.
        UIBackgroundModes:
          - audio
        # Plex servers advertise themselves via Bonjour on the LAN; iOS
        # requires explicit consent to talk to them even over HTTP. The
        # purpose string surfaces in the iOS permission prompt.
        NSLocalNetworkUsageDescription: ramus needs local network access to find Plex servers on your home network.
        NSBonjourServices:
          - _plex._tcp
        # iOS 26 made UIScene lifecycle adoption mandatory; the iOS 27 SDK turns
        # non-adoption into a hard launch crash (EXC_BREAKPOINT in
        # UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption), before any
        # app code runs. Tauri/tao (0.34.x) manages its own UIWindow from the app
        # delegate and never assigns a windowScene, so a bare manifest stops the
        # crash but leaves the window orphaned → black screen. RamusSceneDelegate
        # re-parents tao's window onto the scene. Required to launch AND render on
        # iOS 27; harmless on older iOS.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: RamusSceneDelegate
    entitlements:
      path: ramus-tauri_iOS/ramus-tauri_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        # The app target gained hand-written Swift (App Intents / Siri) alongside
        # main.mm, making it a mixed Obj-C++/Swift target. SWIFT_VERSION is
        # required once any .swift is present; the bridging header exposes the
        # Rust C ABI (libapp.a) to that Swift. App Intents metadata extraction
        # scans this target's own compiled Swift, which is why the intents must
        # live here rather than in the static-library plugin.
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ramus-tauri/ramus-Bridging-Header.h
        # Extra Swift compilation conditions, substituted from the environment at
        # generate time (empty by default → normal builds are unaffected).
        # scripts/ios-dev-ai.sh sets RAMUS_SWIFT_CONDITIONS=RAMUS_IOS27_SCHEMAS to
        # compile the iOS-27 audio assistant-schema tier in RamusSiriIntents.swift,
        # which only builds under the Xcode 27 beta SDK. regen-ios-project.sh
        # exports the var (defaulting empty) so a plain regen leaves it off.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ${RAMUS_SWIFT_CONDITIONS}
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: false
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # AVFoundation / MediaPlayer are linked by the plugin's Swift
      # package; listing them again here is a no-op but makes the
      # surface explicit.
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      # App Intents / Siri surface (RamusSiriIntents.swift).
      - sdk: AppIntents.framework
      # Resolves `_mpv_*` symbols from `libapp.a`.
      - package: MPVKit
    preBuildScripts:
      - script: |
          . "$HOME/.cargo/env"
          cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a